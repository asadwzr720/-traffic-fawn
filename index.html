<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Online Licence Verification</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        linear-gradient(rgba(225, 245, 238, 0.82), rgba(225, 245, 238, 0.82)),
        url("/green-texture.webp") center/cover fixed no-repeat;
      color: #111827;
    }

    /* =========================
       HOME PAGE
    ========================== */

    .home {
      min-height: 100vh;
      padding: 25px 20px 60px;
    }

    .menu {
      display: flex;
      justify-content: flex-end;
      max-width: 1000px;
      margin: auto;
    }

    .menu-button {
      border: 0;
      background: transparent;
      color: #111;
      font-size: 35px;
      font-weight: bold;
      cursor: pointer;
    }

    .hero {
      max-width: 700px;
      margin: 250px auto 0;
      text-align: center;
    }

    h1 {
      margin: 0 0 45px;
      color: #164bc5;
      font-size: clamp(42px, 7vw, 68px);
      line-height: 1.1;
      font-weight: 800;
    }

    .search {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 85px;
      overflow: hidden;
      border-radius: 12px;
      background: white;
      box-shadow: 0 5px 12px rgba(0,0,0,.15);
    }

    .search input {
      width: 100%;
      height: 72px;
      padding: 0 22px;
      border: 0;
      outline: 0;
      background: white;
      color: #222;
      font-size: 22px;
    }

    .search input::placeholder {
      color: #9ca3af;
    }

    .search button {
      height: 72px;
      border: 0;
      background: #ef0015;
      color: white;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .search button svg {
      width: 34px;
      height: 34px;
    }

    .features-inline {
      display: flex;
      justify-content: center;
      gap: 42px;
      flex-wrap: wrap;
      margin-top: 55px;
      color: white;
      font-size: 30px;
      font-weight: 800;
      text-shadow: 0 2px 5px rgba(0,0,0,.12);
    }

    .features-bottom {
      width: fit-content;
      margin: 150px auto 0;
      display: grid;
      gap: 42px;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 30px;
      font-weight: 800;
    }

    .feature-icon {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      font-size: 38px;
    }

    .green { color: #00ad56; }
    .red { color: #ef0015; }
    .blue { color: #1473ed; }

    .error {
      display: none;
      max-width: 700px;
      margin: 20px auto 0;
      padding: 14px 18px;
      border-radius: 8px;
      background: #ffe7e9;
      color: #a31522;
      text-align: center;
      font-weight: 600;
    }

    .error.show {
      display: block;
    }

    /* =========================
       RESULT PAGE
    ========================== */

    .result-page {
      display: none;
      width: min(100% - 24px, 660px);
      margin: auto;
      padding: 12px 0 35px;
    }

    body.results-view .home {
      display: none;
    }

    body.results-view .result-page {
      display: block;
    }

    .result-banner {
      display: block;
      width: 100%;
      height: auto;
      margin-bottom: 18px;
    }

    .result-search {
      display: grid;
      grid-template-columns: 1fr 72px;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 5px 12px rgba(0,0,0,.15);
      margin-bottom: 22px;
    }

    .result-search input {
      height: 56px;
      border: 0;
      outline: 0;
      padding: 0 16px;
      font-size: 17px;
    }

    .result-search button {
      border: 0;
      background: #e60012;
      color: white;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .result-search svg {
      width: 28px;
      height: 28px;
    }

    .result-card {
      overflow: hidden;
      border-radius: 10px;
      background: white;
      box-shadow: 0 5px 12px rgba(0,0,0,.15);
    }

    .result-head {
      padding: 17px;
      background: #e5e7eb;
      text-align: center;
      font-size: 17px;
    }

    .detail {
      border-bottom: 1px solid #111;
    }

    .detail:last-child {
      border-bottom: 0;
    }

    .detail:nth-child(odd) {
      background: #f3f4f6;
    }

    .detail label,
    .detail strong {
      display: block;
      padding: 13px 16px;
      font-size: 16px;
      font-weight: 400;
    }

    .detail label {
      border-bottom: 1px solid #d1d5db;
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 700px) {
      .hero {
        margin-top: 160px;
      }

      h1 {
        font-size: 43px;
        margin-bottom: 35px;
      }

      .search {
        grid-template-columns: 1fr 68px;
      }

      .search input,
      .search button {
        height: 62px;
      }

      .search input {
        font-size: 17px;
      }

      .features-inline {
        gap: 18px;
        font-size: 20px;
        margin-top: 40px;
      }

      .features-bottom {
        margin-top: 100px;
        gap: 30px;
      }

      .feature {
        font-size: 22px;
      }

      .feature-icon {
        width: 42px;
        height: 42px;
        font-size: 30px;
      }
    }

    @media (max-width: 430px) {
      .hero {
        margin-top: 125px;
      }

      h1 {
        font-size: 37px;
      }

      .features-inline {
        font-size: 17px;
        gap: 14px;
      }

      .feature {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- HOME PAGE -->
  <main class="home">

    <div class="menu">
      <button class="menu-button" aria-label="Menu">☰</button>
    </div>

    <section class="hero">

      <h1>
        Welcome To Online<br>
        Verification Services
      </h1>

      <form class="search" id="search-form">

        <input
          id="licence-input"
          type="text"
          inputmode="text"
          autocomplete="off"
          placeholder="Type DL/CNIC Number Without Dash"
          aria-label="Licence or CNIC number"
        >

        <button type="submit" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none">
            <circle
              cx="11"
              cy="11"
              r="7"
              stroke="currentColor"
              stroke-width="2.5"
            />
            <path
              d="m16.5 16.5 4 4"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
            />
          </svg>
        </button>

      </form>

      <div id="error-message" class="error"></div>

      <div class="features-inline">
        <span>• Secure</span>
        <span>• Fast</span>
        <span>• Reliable</span>
      </div>

    </section>

    <section class="features-bottom">

      <div class="feature">
        <span class="feature-icon green">🛡</span>
        <span>Digital Security</span>
      </div>

      <div class="feature">
        <span class="feature-icon red">●</span>
        <span>24/7 Available</span>
      </div>

      <div class="feature">
        <span class="feature-icon blue">🌐</span>
        <span>Global Access</span>
      </div>

    </section>

  </main>


  <!-- RESULT PAGE -->
  <main class="result-page">

    <img
      class="result-banner"
      src="/result-banner.jpeg"
      alt="Licence Verification"
    >

    <form class="result-search" id="result-search-form">

      <input
        id="result-input"
        type="text"
        inputmode="text"
        autocomplete="off"
        placeholder="Type DL/CNIC Number Without Dash"
      >

      <button type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none">
          <circle
            cx="11"
            cy="11"
            r="7"
            stroke="currentColor"
            stroke-width="2.5"
          />
          <path
            d="m16.5 16.5 4 4"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
          />
        </svg>
      </button>

    </form>

    <article class="result-card">

      <div class="result-head">
        License Number:
        <strong id="licence-number"></strong>
      </div>

      <div class="detail">
        <label>Name</label>
        <strong id="name"></strong>
      </div>

      <div class="detail">
        <label>Father name</label>
        <strong id="father-name"></strong>
      </div>

      <div class="detail">
        <label>Date of Birth</label>
        <strong id="date-of-birth"></strong>
      </div>

      <div class="detail">
        <label>First Issue</label>
        <strong id="first-issue"></strong>
      </div>

      <div class="detail">
        <label>Issue / Renewal</label>
        <strong id="issue-renewal"></strong>
      </div>

      <div class="detail">
        <label>Validity</label>
        <strong id="valid-until"></strong>
      </div>

      <div class="detail">
        <label>Category</label>
        <strong id="category"></strong>
      </div>

    </article>

  </main>


  <script>

    /* =========================
       YOUR RECORDS
    ========================== */

    const records = {

      "UP671092871201": {

        firstIssue: "15 Apr 2019",

        category: "M.CYCLE+M.CAR/JEEP ONLY",
        expiry: "14 Apr 2028"
      },

      "UP9081726354": {

        name: "Aamir Shah",
        father: "Naeem Shah",
        dateOfBirth: "12 June 1994",
        firstIssue: "20 August 2020",
        issueRenewal: "20 August 2025",
        category: "LMV / MCWG",
        expiry: "19 August 2030"
      },

      "UP1831831833": {
        licence: "UP1831831833",
        name: "Arshad",
        father: "Gul Raham",
        dateOfBirth: "10 October 2001",
        firstIssue: "11/2000",
        issueRenewal: "11/2000",
        category: "Car",
        expiry: "26 August 2728"
      },

      "UP1831831834": {
        licence: "UP1831831834",
        name: "samood",
        father: "Gul Raham",
        dateOfBirth: "10 October 2001",
        firstIssue: "11/2000",
        issueRenewal: "11/2000",
        category: "Car",
        expiry: "26 August 2728"
      },

      "UP1831831835": {
        licence: "UP1831831835",
        name: "samood",
        father: "Gul Raham",
        dateOfBirth: "10 October 2001",
        firstIssue: "11/2000",
        issueRenewal: "11/2000",
        category: "Car",
        expiry: "26 August 2728"
      },

      "UP1831831838": {
        licence: "UP1831831838",
        name: "adil",
        father: "adil Raham",
        dateOfBirth: "10 October 2001",
        firstIssue: "11/2000",
        issueRenewal: "11/2000",
        category: "Car",
        expiry: "26 August 2728"
      },

      "UP1831831839": {
        licence: "UP1831831839",
        name: "zeeshan ullah",
        father: "Zer Ali Khan",
        dateOfBirth: "15 june 2006",
        firstIssue: "11/2000",
        issueRenewal: "11/2000",
        category: "Car",
        expiry: "26 August 2728"
      },

      "UP10676109287": {
        licence: "UP10676109287",
        name: "Harsh Kumar",
        father: "Yamuna Dass",
        dateOfBirth: "7 Octuber 1984",
        firstIssue: "16/09/2018",
        issueRenewal: "16/09/2018",
        category: "Car",
        expiry: "15 September 2028"
      },

      "UP10676109288": {
        licence: "UP10676109288",
        name: "Wajid Kumar",
        father: "Noor Alam Kumar",
        dateOfBirth: "7 Octuber 1984",
        firstIssue: "16/09/2018",
        issueRenewal: "16/09/2018",
        category: "Car",
        expiry: "15 September 2028"
      }

    };


    /* =========================
       SEARCH SYSTEM
    ========================== */

    const form = document.getElementById("search-form");
    const input = document.getElementById("licence-input");

    const resultForm =
      document.getElementById("result-search-form");

    const resultInput =
      document.getElementById("result-input");

    const error =
      document.getElementById("error-message");


    function cleanNumber(value) {

      return value
        .trim()
        .replace(/[\s-]/g, "")
        .toUpperCase();

    }


    function searchLicence(value) {

      const key = cleanNumber(value);

      error.classList.remove("show");


      if (!key) {

        error.textContent =
          "Please enter a licence or CNIC number.";

        error.classList.add("show");

        return;

      }


      const record = records[key];


      if (!record) {

        error.textContent = "Record not found.";

        error.classList.add("show");

        return;

      }


      document.getElementById("licence-number").textContent =
        record.licence;

      document.getElementById("name").textContent =
        record.name;

      document.getElementById("father-name").textContent =
        record.father;

      document.getElementById("date-of-birth").textContent =
        record.dateOfBirth;

      document.getElementById("first-issue").textContent =
        record.firstIssue;

      document.getElementById("issue-renewal").textContent =
        record.issueRenewal;

      document.getElementById("valid-until").textContent =
        record.expiry;

      document.getElementById("category").textContent =
        record.category;


      resultInput.value = record.licence;

      document.body.classList.add("results-view");

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    form.addEventListener("submit", function(event) {

      event.preventDefault();

      searchLicence(input.value);

    });


    resultForm.addEventListener("submit", function(event) {

      event.preventDefault();

      const key = cleanNumber(resultInput.value);
      const record = records[key];

      if (!record) {

        alert("Record not found.");

        return;

      }

      searchLicence(resultInput.value);

    });


    /* QR / ?licence= support */

    const fromUrl =
      new URLSearchParams(window.location.search)
        .get("licence");

    if (fromUrl) {

      input.value = fromUrl;

      searchLicence(fromUrl);

      history.replaceState(
        null,
        "",
        window.location.pathname
      );

    }

  </script>

</body>
</html>
