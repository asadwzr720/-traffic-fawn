<!-- =========================
     MENU BUTTON
========================== -->

<button class="menu-btn" id="menuBtn" aria-label="Open menu">
  ☰
</button>

<div class="menu-overlay" id="menuOverlay"></div>


<!-- =========================
     SIDE MENU
========================== -->

<aside class="side-menu" id="sideMenu">

  <div class="menu-header">

    <strong>Menu</strong>

    <button
      type="button"
      class="close-menu"
      id="closeMenu"
      aria-label="Close menu"
    >
      ×
    </button>

  </div>

  <div class="menu-line"></div>


  <nav class="side-links">

    <!-- HOME -->

    <a href="#" id="homeLink">

      <span class="menu-icon">

        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 3 2.5 11h2.7v9h5v-5.5h3.6V20h5v-9h2.7L12 3Z"/>
        </svg>

      </span>

      <span>Home</span>

    </a>


    <!-- LOGIN -->

    <a href="#" id="loginLink">

      <span class="menu-icon">

        <svg viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="7" r="4"/>
          <path d="M4.5 21v-2.5c0-4 3.2-6.5 7.5-6.5s7.5 2.5 7.5 6.5V21h-15Z"/>
        </svg>

      </span>

      <span>Login</span>

    </a>

  </nav>

</aside>


<!-- =========================
     ADMIN LOGIN SCREEN
========================== -->

<main class="login-page" id="loginPage">

  <section class="login-box">

    <h2>
      Welcome Back Admin 👋
    </h2>


    <form id="adminLoginForm">


      <!-- EMAIL -->

      <div class="login-field">

        <label for="adminEmail">
          Email Address
        </label>

        <input
          type="email"
          id="adminEmail"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

      </div>


      <!-- PASSWORD -->

      <div class="login-field">

        <label for="adminPassword">
          Password
        </label>


        <div class="password-wrap">

          <input
            type="password"
            id="adminPassword"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >


          <!-- EYE -->

          <button
            type="button"
            class="show-password"
            id="showPassword"
            aria-label="Show password"
          >

            <svg
              viewBox="0 0 24 24"
              fill="none"
            >

              <path
                d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"
                stroke="currentColor"
                stroke-width="2"
              />

              <circle
                cx="12"
                cy="12"
                r="3"
                stroke="currentColor"
                stroke-width="2"
              />

            </svg>

          </button>

        </div>

      </div>


      <!-- LOGIN BUTTON -->

      <button
        type="submit"
        class="admin-login-btn"
      >
        Login
      </button>


      <div
        class="login-error"
        id="loginError"
      ></div>

    </form>

  </section>

</main>


<style>

/* =========================
   MENU BUTTON
========================== */

.menu-btn {
  position: fixed;

  top: 22px;
  right: 24px;

  z-index: 100;

  width: 48px;
  height: 48px;

  display: grid;
  place-items: center;

  padding: 0;

  border: 0;

  background: transparent;

  color: #000;

  font-size: 34px;
  font-weight: 800;

  cursor: pointer;
}


/* =========================
   OVERLAY
========================== */

.menu-overlay {
  position: fixed;

  inset: 0;

  z-index: 998;

  background: rgba(0,0,0,.35);

  opacity: 0;

  visibility: hidden;

  transition: .25s;
}


/* =========================
   SIDE MENU
========================== */

.side-menu {
  position: fixed;

  top: 0;
  right: 0;

  z-index: 999;

  width: min(67vw, 440px);

  height: 100vh;

  padding: 45px 44px;

  background: #fff;

  transform: translateX(100%);

  transition: transform .28s ease;

  box-shadow: -5px 0 20px rgba(0,0,0,.08);
}


body.menu-open .side-menu {
  transform: translateX(0);
}


body.menu-open .menu-overlay {
  opacity: 1;

  visibility: visible;
}


.menu-header {
  display: flex;

  align-items: center;

  justify-content: space-between;

  color: #111827;

  font-family: Arial, Helvetica, sans-serif;

  font-size: 25px;

  font-weight: 700;
}


.close-menu {
  width: 42px;
  height: 42px;

  padding: 0;

  border: 0;

  background: transparent;

  color: #111;

  font-size: 38px;

  line-height: 1;
}


.menu-line {
  height: 1px;

  margin-top: 12px;

  background: #222;
}


.side-links {
  padding-top: 25px;
}


.side-links a {
  display: flex;

  align-items: center;

  gap: 22px;

  padding: 19px 12px;

}


.menu-icon {

  height: 32px;

  display: grid;

  place-items: center;
}


.menu-icon svg {
  width: 27px;

}


/* =========================
   LOGIN PAGE
========================== */

.login-page {
  display: none;

  min-height: 100vh;

  padding: 20px;

  align-items: center;

  justify-content: center;
}


/*
When Login is clicked:
hide home + result
*/

body.login-view .home,
body.login-view .result-page {
  display: none !important;
}


/* Show login */

body.login-view .login-page {
  display: flex;
}

/* =========================
   LOGIN BOX
========================== */

.login-box {

.login-box h2 {

   PASSWORD EYE
========================== */

  position: relative;
}


.password-wrap input {

}


.show-password {
  position: absolute;

  top: 50%;

  right: 15px;

  transform: translateY(-50%);

  width: 45px;
  height: 45px;

  display: grid;

  place-items: center;

  padding: 0;

  border: 0;

  background: transparent;

  color: #536178;

  cursor: pointer;
}


.show-password svg {
  width: 28px;

  height: 28px;
}


/* =========================
   BLACK LOGIN BUTTON
========================== */

.admin-login-btn {
  width: 100%;

  height: 75px;

  border: 0;

  border-radius: 10px;

  background: #000;

  color: #fff;

  font-family: Arial, Helvetica, sans-serif;

  font-size: 27px;

  cursor: pointer;
}

}


/* =========================
   LOGIN ERROR
========================== */

.login-error {
  display: none;

  margin-top: 16px;

  padding: 12px;

  border-radius: 8px;

  background: #ffe7e9;

  color: #a31522;

}


/* =========================
   MOBILE
========================== */

@media (max-width: 600px) {

  .menu-btn {
    top: 15px;

    right: 16px;
  }


  .side-menu {
    width: 67%;

    padding: 35px 28px;
  }


  .menu-header {

  }

    gap: 18px;

  }


  .login-box {

    margin-top: -20px;
  }


  .login-box h2 {
    margin-bottom: 45px;

    font-size: 32px;
  }


  .login-field label {
    font-size: 20px;
  }


  .login-field input {
    height: 64px;

    font-size: 20px;
  }


  .admin-login-btn {

    font-size: 22px;
  }

</style>


<script>

/* =========================
   MENU
========================== */

const menuBtn =
  document.getElementById("menuBtn");

const closeMenu =
  document.getElementById("closeMenu");

const menuOverlay =
  document.getElementById("menuOverlay");

const homeLink =
  document.getElementById("homeLink");

const loginLink =
  document.getElementById("loginLink");


/* OPEN MENU */

menuBtn.addEventListener(
  "click",
  function() {

    document.body.classList.add("menu-open");

  }
);


/* CLOSE MENU */

closeMenu.addEventListener(
  "click",
  function() {

    document.body.classList.remove("menu-open");

  }
);


/* CLICK OUTSIDE */

menuOverlay.addEventListener(
  "click",
  function() {

    document.body.classList.remove("menu-open");

  }
);


/* =========================
   LOGIN CLICK
========================== */

loginLink.addEventListener(
  "click",
  function(event) {

    event.preventDefault();

    /* Close side menu */
    document.body.classList.remove(
      "menu-open"
    );

    /* Close result */
    document.body.classList.remove(
      "results-view"
    );

    /* OPEN LOGIN FORM */
    document.body.classList.add(
      "login-view"
    );

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }
);


/* =========================
   HOME CLICK
========================== */

homeLink.addEventListener(
  "click",
  function(event) {

    event.preventDefault();

    document.body.classList.remove(
      "menu-open"
    );

    document.body.classList.remove(
      "login-view"
    );

    document.body.classList.remove(
      "results-view"
    );

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }
);


/* =========================
   SHOW / HIDE PASSWORD
========================== */

const adminPassword =
  document.getElementById(
    "adminPassword"
  );

const showPassword =
  document.getElementById(
    "showPassword"
  );


showPassword.addEventListener(
  "click",
  function() {

    if (
      adminPassword.type === "password"
    ) {

      adminPassword.type = "text";

    } else {

      adminPassword.type = "password";

    }

  }
);


/* =========================
   LOGIN FORM
========================== */

const adminLoginForm =
  document.getElementById(
    "adminLoginForm"
  );


adminLoginForm.addEventListener(
  "submit",
  function(event) {

    event.preventDefault();

    /*
      Yahan baad mein Supabase
      authentication connect hogi.
    */

  }
);

</script>
