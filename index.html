<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Online Licence Verification</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  min-width:320px;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:#111827;

  background:
    linear-gradient(
      rgba(225,245,238,.78),
      rgba(225,245,238,.78)
    ),
    url("/green-texture.webp") center/cover fixed no-repeat;
}

button,
input{
  font-family:Arial,Helvetica,sans-serif;
}

button{
  cursor:pointer;
}


/* =========================
   MENU BUTTON
========================= */

.menu-btn{
  position:fixed;
  top:22px;
  right:24px;
  z-index:100;

  width:48px;
  height:48px;

  display:grid;
  place-items:center;

  border:0;
  padding:0;

  background:transparent;
  color:#000;

  font-size:34px;
  font-weight:900;
}


/* =========================
   MENU OVERLAY
========================= */

.menu-overlay{
  position:fixed;
  inset:0;
  z-index:998;

  background:rgba(0,0,0,.35);

  opacity:0;
  visibility:hidden;

  transition:.25s;
}

body.menu-open .menu-overlay{
  opacity:1;
  visibility:visible;
}


/* =========================
   SIDE MENU
========================= */

.side-menu{
  position:fixed;
  top:0;
  right:0;
  z-index:999;

  width:min(67vw,440px);
  height:100vh;

  padding:45px 44px;

  background:#fff;

  transform:translateX(100%);
  transition:transform .28s ease;

  box-shadow:-5px 0 20px rgba(0,0,0,.08);
}

body.menu-open .side-menu{
  transform:translateX(0);
}

.menu-header{
  display:flex;
  align-items:center;
  justify-content:space-between;

  color:#111827;

  font-size:25px;
  font-weight:800;
}

.close-menu{
  width:42px;
  height:42px;

  display:grid;
  place-items:center;

  border:0;
  padding:0;

  background:transparent;

  color:#111;

  font-size:38px;
  font-weight:800;
}

.menu-line{
  height:1px;
  margin-top:12px;
  background:#222;
}

.side-links{
  padding-top:25px;
}

.side-links a{
  display:flex;
  align-items:center;

  gap:22px;

  padding:19px 12px;

  border-radius:8px;

  color:#172132;

  text-decoration:none;

  font-size:25px;
  font-weight:500;
}

.side-links a:hover{
  background:#f5f6f8;
}

.menu-icon{
  width:32px;
  height:32px;

  display:grid;
  place-items:center;
}

.menu-icon svg{
  width:27px;
  height:27px;
}


/* =========================
   HOME
========================= */

.home{
  min-height:100vh;
  padding:25px 20px 60px;
}


/*
  This controls the exact vertical
  position of heading + search.
*/

.hero{
  width:100%;
  max-width:700px;

  margin:250px auto 0;

  text-align:center;
}


/* =========================
   MAIN HEADING
========================= */

.hero h1{
  margin:0 0 45px;

  color:#1749c6;

  font-size:clamp(42px,6vw,60px);

  line-height:1.08;

  font-weight:900;

  letter-spacing:-1.5px;
}


/* =========================
   SEARCH BAR
========================= */

.search{
  width:100%;
  max-width:670px;

  margin:0 auto;

  display:grid;

  grid-template-columns:1fr 85px;

  overflow:hidden;

  border-radius:12px;

  background:#fff;

  box-shadow:
    0 6px 12px
    rgba(0,0,0,.16);
}


/* SEARCH INPUT */

.search input{
  width:100%;
  height:72px;

  padding:0 22px;

  border:0;
  outline:0;

  background:#fff;

  color:#111827;

  font-size:20px;

  font-weight:700;
}


/* PLACEHOLDER */

.search input::placeholder{
  color:#9ca3af;

  opacity:1;

  font-weight:700;
}


/* RED SEARCH BUTTON */

.search button{
  height:72px;

  display:grid;
  place-items:center;

  border:0;

  background:#ef0015;

  color:#fff;
}

.search button:hover{
  background:#d90013;
}

.search button svg{
  width:34px;
  height:34px;
}


/* =========================
   SECURE FAST RELIABLE
========================= */

.features-inline{
  display:flex;

  justify-content:center;

  flex-wrap:wrap;

  gap:38px;

  margin-top:48px;

  color:#fff;

  font-size:27px;

  font-weight:900;

  text-shadow:
    0 3px 7px
    rgba(0,0,0,.14);
}

.features-inline span{
  color:#fff;
  font-weight:900;
}


/* =========================
   BOTTOM FEATURES
========================= */

.features-bottom{
  width:fit-content;

  margin:135px auto 0;

  display:grid;

  gap:38px;
}

.feature{
  display:flex;

  align-items:center;

  gap:18px;

  color:#111827;

  font-size:28px;

  font-weight:900;

  letter-spacing:-.5px;
}

.feature-text{
  color:#111827;
  font-weight:900;
}

.feature-icon{
  width:52px;
  height:52px;

  display:grid;
  place-items:center;
}

.feature-icon svg{
  width:48px;
  height:48px;
}

.green{
  color:#00ad56;
}

.red{
  color:#ef0015;
}

.blue{
  color:#1473ed;
}


/* =========================
   SEARCH ERROR
========================= */

.search-error{
  display:none;

  max-width:670px;

  margin:18px auto 0;

  padding:13px 16px;

  border-radius:8px;

  background:#ffe7e9;

  color:#a31522;

  font-weight:700;

  text-align:center;
}

.search-error.show{
  display:block;
}


/* =========================
   LOGIN PAGE
========================= */

.login-page{
  display:none;

  min-height:100vh;

  padding:25px;

  align-items:center;
  justify-content:center;
}

body.login-view .home,
body.login-view .result-page{
  display:none !important;
}

body.login-view .login-page{
  display:flex;
}

.login-box{
  width:min(100%,570px);

  margin-top:-30px;
}

.login-box h2{
  margin:0 0 55px;

  color:#172132;

  text-align:center;

  font-size:42px;

  line-height:1.2;

  font-weight:700;

  letter-spacing:-1px;
}

.login-field{
  margin-bottom:32px;
}

.login-field label{
  display:block;

  margin-bottom:14px;

  color:#273447;

  font-size:25px;

  font-weight:500;
}

.login-field input{
  width:100%;
  height:76px;

  padding:0 22px;

  border:1px solid rgba(100,116,139,.15);

  border-radius:10px;

  outline:none;

  background:rgba(255,255,255,.08);

  color:#172132;

  font-size:26px;
}

.login-field input::placeholder{
  color:#69716f;
  opacity:1;
}

.login-field input:focus{
  border-color:rgba(23,33,50,.40);

  background:rgba(255,255,255,.15);
}


/* PASSWORD */

.password-wrap{
  position:relative;
}

.password-wrap input{
  padding-right:70px;
}

.show-password{
  position:absolute;

  top:50%;
  right:15px;

  transform:translateY(-50%);

  width:45px;
  height:45px;

  display:grid;
  place-items:center;

  border:0;

  background:transparent;

  color:#536178;
}

.show-password svg{
  width:28px;
  height:28px;
}


/* LOGIN BUTTON */

.admin-login-btn{
  width:100%;
  height:75px;

  border:0;

  border-radius:10px;

  background:#000;

  color:#fff;

  font-size:27px;

  font-weight:500;
}


/* =========================
   RESULT PAGE
========================= */

.result-page{
  display:none;

  width:min(calc(100% - 24px),660px);

  margin:auto;

  padding:12px 0 35px;
}

body.results-view .home,
body.results-view .login-page{
  display:none !important;
}

body.results-view .result-page{
  display:block;
}

body.results-view .menu-btn{
  display:none;
}

.result-banner{
  display:block;

  width:100%;
  height:auto;

  margin-bottom:18px;
}


/* RESULT SEARCH */

.result-search{
  display:grid;

  grid-template-columns:1fr 72px;

  overflow:hidden;

  margin-bottom:22px;

  border-radius:10px;

  background:#fff;

  box-shadow:0 5px 12px rgba(0,0,0,.15);
}

.result-search input{
  width:100%;
  height:56px;

  padding:0 16px;

  border:0;

  outline:0;

  font-size:17px;
}

.result-search button{
  display:grid;
  place-items:center;

  border:0;

  background:#e60012;

  color:#fff;
}

.result-search svg{
  width:28px;
  height:28px;
}


/* RESULT CARD */

.result-card{
  overflow:hidden;

  border-radius:10px;

  background:#fff;

  box-shadow:0 5px 12px rgba(0,0,0,.15);
}

.result-head{
  padding:17px;

  background:#e5e7eb;

  color:#111;

  text-align:center;

  font-size:17px;

  font-weight:700;
}

.detail{
  border-bottom:1px solid #111;
}

.detail:last-child{
  border-bottom:0;
}

.detail:nth-child(odd){
  background:#f3f4f6;
}

.detail label,
.detail strong{
  display:block;

  padding:13px 16px;

  color:#111;

  font-size:16px;
}

.detail label{
  border-bottom:1px solid #d1d5db;

  font-weight:500;
}

.detail strong{
  font-weight:700;
}


/* =========================
   TABLET / MOBILE
========================= */

@media(max-width:700px){

  .hero{
    max-width:700px;

    margin:250px auto 0;
  }

  .hero h1{
    margin-bottom:45px;

    font-size:42px;

    font-weight:900;
  }

  .search{
    width:100%;

    max-width:670px;

    grid-template-columns:1fr 70px;
  }

  .search input,
  .search button{
    height:62px;
  }

  .search input{
    padding:0 18px;

    font-size:17px;

    font-weight:700;
  }

  .search input::placeholder{
    font-weight:700;
  }

  .features-inline{
    margin-top:43px;

    gap:20px;

    font-size:20px;

    font-weight:900;
  }

  .features-bottom{
    margin-top:125px;

    gap:32px;
  }

  .feature{
    font-size:23px;

    font-weight:900;
  }

  .feature-icon{
    width:44px;
    height:44px;
  }

  .feature-icon svg{
    width:42px;
    height:42px;
  }

  .side-menu{
    width:67%;

    padding:35px 28px;
  }

  .menu-header{
    font-size:22px;
  }

  .side-links a{
    gap:18px;

    font-size:21px;
  }

  .menu-btn{
    top:15px;
    right:16px;
  }

  .login-box{
    width:100%;

    margin-top:-20px;
  }

  .login-box h2{
    margin-bottom:45px;

    font-size:32px;
  }

  .login-field label{
    font-size:20px;
  }

  .login-field input{
    height:64px;

    font-size:20px;
  }

  .admin-login-btn{
    height:64px;

    font-size:22px;
  }
}


/* PHONE */

@media(max-width:430px){

  .home{
    padding-left:18px;
    padding-right:18px;
  }

  .hero{
    margin-top:185px;
  }

  .hero h1{
    margin-bottom:38px;

    font-size:36px;
  }

  .search{
    grid-template-columns:1fr 65px;
  }

  .search input,
  .search button{
    height:60px;
  }

  .search input{
    font-size:15px;
  }

  .features-inline{
    gap:13px;

    font-size:17px;
  }

  .features-bottom{
    margin-top:105px;
  }

  .feature{
    font-size:20px;
  }
}

</style>
</head>


<body>


<!-- =========================
     MENU BUTTON
========================= -->

<button
  type="button"
  class="menu-btn"
  id="menuBtn"
  aria-label="Open menu"
>
  ☰
</button>


<div
  class="menu-overlay"
  id="menuOverlay"
></div>


<!-- =========================
     SIDE MENU
========================= -->

<aside
  class="side-menu"
  id="sideMenu"
>

  <div class="menu-header">

    <strong>Menu</strong>

    <button
      type="button"
      class="close-menu"
      id="closeMenu"
    >
      ×
    </button>

  </div>

  <div class="menu-line"></div>


  <nav class="side-links">


    <a href="#" id="homeLink">

      <span class="menu-icon">

        <svg viewBox="0 0 24 24" fill="currentColor">

          <path
            d="M12 3 2.5 11h2.7v9h5v-5.5h3.6V20h5v-9h2.7L12 3Z"
          />

        </svg>

      </span>

      <span>Home</span>

    </a>


    <a href="#" id="loginLink">

      <span class="menu-icon">

        <svg viewBox="0 0 24 24" fill="currentColor">

          <circle
            cx="12"
            cy="7"
            r="4"
          />

          <path
            d="M4.5 21v-2.5c0-4 3.2-6.5 7.5-6.5s7.5 2.5 7.5 6.5V21h-15Z"
          />

        </svg>

      </span>

      <span>Login</span>

    </a>

  </nav>

</aside>


<!-- =========================
     HOME
========================= -->

<main class="home">

  <section class="hero">


    <h1>
      Welcome To Online<br>
      Verification Services
    </h1>


    <!-- SEARCH -->

    <form
      class="search"
      id="searchForm"
    >

      <input
        id="licenceInput"
        type="text"
        inputmode="text"
        autocomplete="off"
        placeholder="Type DL/CNIC Number Without Dash"
      >


      <button
        type="submit"
        aria-label="Search"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
        >

          <circle
            cx="11"
            cy="11"
            r="7"
            stroke="currentColor"

          />

          <path
            d="m16.5 16.5 4 4"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
          />

        </svg>

      </button>

    </form>


    <div
      class="search-error"
      id="searchError"
    ></div>


    <!-- SECURE FAST RELIABLE -->

    <div class="features-inline">

      <span>• Secure</span>

      <span>• Fast</span>

      <span>• Reliable</span>

    </div>

  </section>


  <!-- FEATURES -->

  <section class="features-bottom">


    <div class="feature">

        </svg>

      </span>

      <span class="feature-text">
        Digital Security
      </span>

    </div>


    <div class="feature">

      <span class="feature-icon red">

        <svg viewBox="0 0 24 24" fill="currentColor">

          <circle
            cx="12"
            cy="12"
            r="10"
          />

          <path

            fill="none"
            stroke="white"
            stroke-width="2"
            stroke-linecap="round"

        </svg>

      </span>

      <span class="feature-text">
        24/7 Available
      </span>

    </div>


    <div class="feature">

      <span class="feature-icon blue">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >

          <circle
            cx="12"
            cy="12"
            r="9"

          <path d="M3 12h18"/>

            d="M12 3c2.3 2.4 3.5 5.4 3.5 9S14.3 18.6 12 21"

          />

        </svg>

      </span>

      <span class="feature-text">
        Global Access
      </span>

    </div>


  </section>

</main>


<!-- =========================
     LOGIN PAGE
========================= -->

<main
  class="login-page"
  id="loginPage"
>

  <section class="login-box">


    <h2>
      Welcome Back Admin 👋
    </h2>


    <form id="adminLoginForm">


      <div class="login-field">

        <label for="adminEmail">
          Email Address
        </label>

        <input
          type="email"
          id="adminEmail"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

      </div>


      <div class="login-field">

        <label for="adminPassword">
          Password
        </label>


        <div class="password-wrap">

          <input
            type="password"
            id="adminPassword"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >


          <button
            type="button"
            class="show-password"
            id="showPassword"
          >

            <svg
              viewBox="0 0 24 24"
              fill="none"
            >

              <path
                d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"
                stroke="currentColor"
                stroke-width="2"
              />

              <circle
                cx="12"
                cy="12"
                r="3"
                stroke="currentColor"
                stroke-width="2"
              />

            </svg>

          </button>

        </div>

      </div>


      <button
        type="submit"
        class="admin-login-btn"
      >
        Login
      </button>


    </form>

  </section>

</main>


<!-- =========================
     RESULT PAGE
========================= -->

<main class="result-page">


  <img
    src="/result-banner.jpeg"
    class="result-banner"
    alt="Licence Verification"
  >


  <form
    class="result-search"
    id="resultSearchForm"
  >

    <input
      id="resultInput"
      type="text"
      placeholder="Type DL/CNIC Number Without Dash"
    >


    <button type="submit">

      <svg
        viewBox="0 0 24 24"
        fill="none"
      >

        <circle
          cx="11"
          cy="11"
          r="7"
          stroke="currentColor"
          stroke-width="2.5"
        />

        <path
          d="m16.5 16.5 4 4"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
        />

      </svg>

    </button>

  </form>


  <article class="result-card">


    <div class="result-head">

      License Number:

      <span id="licenceNumber"></span>

    </div>


    <div class="detail">

      <label>Name</label>

      <strong id="recordName"></strong>

    </div>


    <div class="detail">

      <label>Father name</label>

      <strong id="fatherName"></strong>

    </div>


    <div class="detail">

      <label>Date of Birth</label>

      <strong id="dateOfBirth"></strong>

    </div>


    <div class="detail">

      <label>First Issue</label>

      <strong id="firstIssue"></strong>

    </div>


    <div class="detail">

      <label>Issue / Renewal</label>

      <strong id="issueRenewal"></strong>

    </div>


    <div class="detail">

      <label>Validity</label>

      <strong id="validUntil"></strong>

    </div>


    <div class="detail">

      <label>Category</label>

      <strong id="category"></strong>

    </div>


  </article>

</main>

    firstIssue:"16/09/2018",
    issueRenewal:"16/09/2018",
    category:"Car",
    expiry:"15 September 2028"
  }

};


/* =========================
   ELEMENTS
========================= */

const menuBtn =
  document.getElementById("menuBtn");

const closeMenu =
  document.getElementById("closeMenu");

const menuOverlay =
  document.getElementById("menuOverlay");

const homeLink =
  document.getElementById("homeLink");

const loginLink =
  document.getElementById("loginLink");

const searchForm =
  document.getElementById("searchForm");

const licenceInput =
  document.getElementById("licenceInput");

const searchError =
  document.getElementById("searchError");

const resultSearchForm =
  document.getElementById("resultSearchForm");

const resultInput =
  document.getElementById("resultInput");

const adminPassword =
  document.getElementById("adminPassword");

const showPassword =
  document.getElementById("showPassword");

const adminLoginForm =
  document.getElementById("adminLoginForm");


/* =========================
   MENU
========================= */

menuBtn.addEventListener("click",function(){

  document.body.classList.add("menu-open");

});


closeMenu.addEventListener("click",function(){

  document.body.classList.remove("menu-open");

});


menuOverlay.addEventListener("click",function(){

  document.body.classList.remove("menu-open");

});


/* =========================
   HOME
========================= */

homeLink.addEventListener("click",function(event){

  event.preventDefault();

  document.body.classList.remove("menu-open");

  document.body.classList.remove("login-view");

  document.body.classList.remove("results-view");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

});


/* =========================
   LOGIN
========================= */

loginLink.addEventListener("click",function(event){

  event.preventDefault();

  document.body.classList.remove("menu-open");

  document.body.classList.remove("results-view");

  document.body.classList.add("login-view");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

});


/* =========================
   PASSWORD EYE
========================= */

showPassword.addEventListener("click",function(){

  if(adminPassword.type === "password"){

    adminPassword.type = "text";

  }else{

    adminPassword.type = "password";

  }

});


/* Login UI only.
   Connect this to your server/Supabase Auth.
*/

adminLoginForm.addEventListener("submit",function(event){

  event.preventDefault();

});


/* =========================
   CLEAN NUMBER
========================= */

function cleanNumber(value){

  return value
    .trim()
    .replace(/[\s-]/g,"")
    .toUpperCase();

}


/* =========================
   SEARCH
========================= */

function searchLicence(value){

  const key =
    cleanNumber(value);

  searchError.classList.remove("show");


  if(!key){

    searchError.textContent =
      "Please enter a licence or CNIC number.";

    searchError.classList.add("show");

    return;

  }


  const record =
    records[key];


  if(!record){

    searchError.textContent =
      "Record not found.";

    searchError.classList.add("show");

    return;

  }


  document.getElementById(
    "licenceNumber"
  ).textContent =
    record.licence;


  document.getElementById(
    "recordName"
  ).textContent =
    record.name;


  document.getElementById(
    "fatherName"
  ).textContent =
    record.father;


  document.getElementById(
    "dateOfBirth"
  ).textContent =
    record.dateOfBirth;


  document.getElementById(
    "firstIssue"
  ).textContent =
    record.firstIssue;


  document.getElementById(
    "issueRenewal"
  ).textContent =
    record.issueRenewal;


  document.getElementById(
    "validUntil"
  ).textContent =
    record.expiry;


  document.getElementById(
    "category"
  ).textContent =
    record.category;


  resultInput.value =
    record.licence;


  document.body.classList.remove(
    "login-view"
  );


  document.body.classList.remove(
    "menu-open"
  );


  document.body.classList.add(
    "results-view"
  );


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* HOME SEARCH */

searchForm.addEventListener(
  "submit",
  function(event){

    event.preventDefault();

    searchLicence(
      licenceInput.value
    );

  }
);


/* RESULT SEARCH */

resultSearchForm.addEventListener(
  "submit",
  function(event){

    event.preventDefault();

    const key =
      cleanNumber(
        resultInput.value
      );


    if(!records[key]){

      alert("Record not found.");

      return;

    }


    searchLicence(
      resultInput.value
    );

  }
);


/* =========================
   QR / URL SEARCH
========================= */

const fromUrl =
  new URLSearchParams(
    window.location.search
  ).get("licence");


if(fromUrl){

  licenceInput.value =
    fromUrl;

  searchLicence(
    fromUrl
  );

  history.replaceState(
    null,
    "",
    window.location.pathname
  );

}

</script>

</body>
</html>
